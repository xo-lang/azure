# azsystemevents: Go's TypeSpec emitter output (azsystemevents v1.1.0)
# and its internal/generate step. The project's tspconfig keeps
# unreachable types and has no operations, so every definition is a
# model; Go's generate step then deletes the event base types below.
data_plane = true
all_definitions = true
# internal/generate: the event type constants (system_events.go)
event_types = true
drop_models = [
  "ACSCallParticipantEventData",
  "ACSChatEventBaseProperties",
  "ACSChatEventInThreadBaseProperties",
  "ACSChatMessageEventBaseProperties",
  "ACSChatMessageEventInThreadBaseProperties",
  "ACSChatThreadEventBaseProperties",
  "ACSChatThreadEventInThreadBaseProperties",
  "ACSMessageEventData",
  "ACSRouterEventData",
  "ACSRouterJobEventData",
  "ACSRouterWorkerEventData",
  "ACSSmsEventBaseProperties",
  "ACSSMSEventBaseProperties",
  "AppConfigurationSnapshotEventData",
  "AVSClusterEventData",
  "AVSPrivateCloudEventData",
  "AVSScriptExecutionEventData",
  "ContainerRegistryArtifactEventData",
  "ContainerRegistryEventData",
  "ContainerServiceClusterSupportEventData",
  "ContainerServiceNodePoolRollingEventData",
  "DeviceConnectionStateEventProperties",
  "DeviceLifeCycleEventProperties",
  "DeviceTelemetryEventProperties",
  "EventGridMQTTClientEventData",
  "MapsGeofenceEventProperties",
  "ResourceNotificationsResourceDeletedEventData",
  "ResourceNotificationsResourceUpdatedEventData",
]

# Go's generate step (swapErrorTypes): the two internal error models'
# fields are Go's Error (error.go), read by custom_events.go's functions
# (error.xo here).
[field_types]
"acsmessagereceivedeventdata.error" = "ErrorModel"
"acsmessagedeliverystatusupdatedeventdata.error" = "ErrorModel"
"acsrouterjobclassificationfailedeventdata.errors" = "List[ErrorModel]"
