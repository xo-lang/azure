# azkeys: what Go's module changes after generating
# (testdata/generate/transforms.go of azkeys v1.5.0) and its shape.
data_plane = true
# TypeSpec's Go emitter writes only the types operations reach.
reachable_only = true
# GetKey, UpdateKey and the others take an empty version (the latest).
allow_empty = ["key-version"]
# custom_client.xo uses the challenge policy.
requires = ["github.com/xo-lang/azure/security/keyvault/internal"]

# `KID *string` becomes `*ID` (custom_client.xo).
[field_types]
kid = "ID"

# DeletedKeyBundle is DeletedKey.
[models]
DeletedKeyBundle = "DeletedKey"

# Go drops the DeletionRecoveryLevel constants for a plain string.
[replace_types]
DeletionRecoveryLevel = "Str"

# Go deletes SignatureAlgorithmRSNULL and KeyOperationExport.
[drop_values]
SignatureAlgorithm = ["RSNULL"]
KeyOperation = ["export"]
