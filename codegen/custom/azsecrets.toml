# azsecrets: what Go's module changes after generating
# (internal/transforms.go of azsecrets v1.4.0) and its shape.
data_plane = true
# TypeSpec's Go emitter writes only the types operations reach.
reachable_only = true
# Go v1.4.0's emitter sends Accept on PurgeDeletedSecret too.
accept_always = true
# Go's ListSecretProperties* overrides take no maxresults.
drop_params = ["maxresults"]
# GetSecret and UpdateSecretProperties take an empty version (the latest).
allow_empty = ["secret-version"]
# custom_client.xo uses the challenge policy.
requires = ["github.com/xo-lang/azure/security/keyvault/internal"]

# `ID *string` and `KID *string` become `*ID` (custom_client.xo).
[field_types]
id = "ID"
kid = "ID"

# Go drops the DeletionRecoveryLevel constants for a plain string.
[replace_types]
DeletionRecoveryLevel = "Str"
