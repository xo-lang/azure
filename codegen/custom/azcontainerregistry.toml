# azcontainerregistry: Go's autorest.md (azcontainerregistry v0.2.3) as
# structured edits. Its swagger-document transforms are `[[patch]]`s here,
# in its order; its rename-operations are `[ops]`. The transforms of
# Go's generated text (constructors removed, Acr to ACR, the response
# body fields, the next link, the hidden upload methods) are the
# options after them.
data_plane = true
# remove-unreferenced-types: true
remove_unreferenced = true
# Extract and add endpoint for nextLink: the Link header's URL
# (custom_client.xo's extract_next_link) joined to the endpoint
next_link_transform = "extract_next_link"
# Hide original UploadChunk and CompleteUpload method (and
# blobClientUploadChunkOptions): blob_custom_client.xo wraps them
private_ops = ["BlobClient.UploadChunk", "BlobClient.CompleteUpload"]
private_types = ["BlobClientUploadChunkOptions"]

# Remove response for "ContainerRegistry_DeleteRepository"
[[patch]]
pointer = "/paths/~1acr~1v1~1{name}/delete/responses/202/schema"
op = "delete"

# Remove response for "ContainerRegistryBlob_DeleteBlob"
[[patch]]
pointer = "/paths/~1v2~1{name}~1blobs~1{digest}/delete/responses/202/schema"
op = "delete"

# Remove "Authentication_GetAcrAccessTokenFromLogin"
[[patch]]
pointer = "/paths/~1oauth2~1token/get"
op = "delete"

# Remove "ContainerRegistry_CheckDockerV2Support"
[[patch]]
pointer = "/paths/~1v2~1/get"
op = "delete"

# Remove "definitions.TagAttributesBase.properties.signed"
[[patch]]
pointer = "/definitions/TagAttributesBase/properties/signed"
op = "delete"

# Add "definitions.ManifestAttributesBase.properties.mediaType"
[[patch]]
pointer = "/definitions/ManifestAttributesBase/properties/mediaType"
op = "set"
value = '{"type": "string", "description": "Media type for this Manifest"}'

# Change "parameters.ApiVersionParameter.required" to true
[[patch]]
pointer = "/parameters/ApiVersionParameter/required"
op = "set"
value = "true"

# Take stream as manifest body
[[patch]]
pointer = "/parameters/ManifestBody/schema"
op = "set"
value = '{"type": "string", "format": "binary"}'

# Change list order by param to enum (tags): splice(3, 1), then push
[[patch]]
pointer = "/paths/~1acr~1v1~1{name}~1_tags/get/parameters/3"
op = "delete"

[[patch]]
pointer = "/paths/~1acr~1v1~1{name}~1_tags/get/parameters"
op = "push"
value = '''{"name": "orderby", "x-ms-client-name": "OrderBy", "in": "query", "required": false, "x-ms-parameter-location": "method", "type": "string", "description": "Sort options for ordering tags in a collection.", "enum": ["none", "timedesc", "timeasc"], "x-ms-enum": {"name": "ArtifactTagOrderBy", "values": [{"value": "none", "name": "None", "description": "Do not provide an orderby value in the request."}, {"value": "timedesc", "name": "LastUpdatedOnDescending", "description": "Order tags by LastUpdatedOn field, from most recently updated to least recently updated."}, {"value": "timeasc", "name": "LastUpdatedOnAscending", "description": "Order tags by LastUpdatedOn field, from least recently updated to most recently updated."}]}}'''

# (manifests)
[[patch]]
pointer = "/paths/~1acr~1v1~1{name}~1_manifests/get/parameters/3"
op = "delete"

[[patch]]
pointer = "/paths/~1acr~1v1~1{name}~1_manifests/get/parameters"
op = "push"
value = '''{"name": "orderby", "x-ms-client-name": "OrderBy", "in": "query", "required": false, "x-ms-parameter-location": "method", "type": "string", "description": "Sort options for ordering manifests in a collection.", "enum": ["none", "timedesc", "timeasc"], "x-ms-enum": {"name": "ArtifactManifestOrderBy", "values": [{"value": "none", "name": "None", "description": "Do not provide an orderby value in the request."}, {"value": "timedesc", "name": "LastUpdatedOnDescending", "description": "Order manifests by LastUpdatedOn field, from most recently updated to least recently updated."}, {"value": "timeasc", "name": "LastUpdatedOnAscending", "description": "Order manifest by LastUpdatedOn field, from least recently updated to most recently updated."}]}}'''

# Change ContainerRegistry_CreateManifest behaviour
[[patch]]
pointer = "/paths/~1v2~1{name}~1manifests~1{reference}/put/consumes"
op = "push"
value = '"application/vnd.oci.image.manifest.v1+json"'

[[patch]]
pointer = "/paths/~1v2~1{name}~1manifests~1{reference}/put/responses/201/schema"
op = "delete"

# Change ContainerRegistry_GetManifest behaviour
[[patch]]
pointer = "/paths/~1v2~1{name}~1manifests~1{reference}/get/responses/200/schema"
op = "set"
value = '{"type": "string", "format": "file"}'

[[patch]]
pointer = "/paths/~1v2~1{name}~1manifests~1{reference}/get/responses/200/headers"
op = "set"
value = '{"Docker-Content-Digest": {"type": "string", "description": "Digest of the targeted content for the request."}}'

# Rename parameter name
[[patch]]
pointer = "/parameters/DigestReference/x-ms-client-name"
op = "set"
value = '"digest"'

[[patch]]
pointer = "/parameters/TagReference/x-ms-client-name"
op = "set"
value = '"tag"'

# Add 202 response to ContainerRegistryBlob_MountBlob
[[patch]]
pointer = "/paths/~1v2~1{name}~1blobs~1uploads~1/post/responses/202"
op = "copy"
from = "/paths/~1v2~1{name}~1blobs~1uploads~1/post/responses/201"

# Rename TagAttributesBase, ManifestAttributesBase, TagAttributeBases,
# Repositories, AcrManifests and QueryNum
[[patch]]
pointer = "/definitions/TagAttributesBase/x-ms-client-name"
op = "set"
value = '"TagAttributes"'

[[patch]]
pointer = "/definitions/ManifestAttributesBase/x-ms-client-name"
op = "set"
value = '"ManifestAttributes"'

[[patch]]
pointer = "/definitions/TagList/properties/tags/x-ms-client-name"
op = "delete"

[[patch]]
pointer = "/definitions/Repositories/properties/repositories/x-ms-client-name"
op = "set"
value = '"Names"'

[[patch]]
pointer = "/definitions/AcrManifests/x-ms-client-name"
op = "set"
value = '"Manifests"'

[[patch]]
pointer = "/definitions/AcrManifests/properties/manifests/x-ms-client-name"
op = "set"
value = '"Attributes"'

[[patch]]
pointer = "/parameters/QueryNum/x-ms-client-name"
op = "set"
value = '"MaxNum"'

# Rename binary request param and response property
[[patch]]
pointer = "/parameters/RawData/x-ms-client-name"
op = "set"
value = '"chunkData"'

[[patch]]
pointer = "/parameters/RawDataOptional/x-ms-client-name"
op = "set"
value = '"blobData"'

[[patch]]
pointer = "/parameters/ManifestBody/x-ms-client-name"
op = "set"
value = '"manifestData"'

# Hide original UploadChunk and CompleteUpload method: splice(1, 1)
[[patch]]
pointer = "/paths/~1{nextBlobUuidLink}/put/parameters/1"
op = "delete"

# Add content-range parameters to upload chunk
[[patch]]
pointer = "/paths/~1{nextBlobUuidLink}/patch/parameters"
op = "push"
value = '{"name": "Content-Range", "in": "header", "type": "string", "description": "Range of bytes identifying the desired block of content represented by the body. Start must the end offset retrieved via status check plus one. Note that this is a non-standard use of the Content-Range header."}'

# Add description for ArtifactOperatingSystem, RefreshToken and AccessToken
[[patch]]
pointer = "/definitions/ArtifactOperatingSystem/description"
op = "set"
value = '''"The artifact platform's operating system."'''

[[patch]]
pointer = "/definitions/RefreshToken/description"
op = "set"
value = '"The ACR refresh token response."'

[[patch]]
pointer = "/definitions/AccessToken/description"
op = "set"
value = '"The ACR access token response."'

# Rename paged operations from Get* to List*, and the others
[ops]
ContainerRegistry_GetManifests = "ListManifests"
ContainerRegistry_GetRepositories = "ListRepositories"
ContainerRegistry_GetTags = "ListTags"
ContainerRegistry_GetProperties = "GetRepositoryProperties"
ContainerRegistry_UpdateProperties = "UpdateRepositoryProperties"
ContainerRegistry_UpdateTagAttributes = "UpdateTagProperties"
ContainerRegistry_CreateManifest = "UploadManifest"
# Rename all Acr to ACR (a replace over Go's generated text)
Authentication_ExchangeAadAccessTokenForAcrRefreshToken = "ExchangeAADAccessTokenForACRRefreshToken"
Authentication_ExchangeAcrRefreshTokenForAcrAccessToken = "ExchangeACRRefreshTokenForACRAccessToken"

[models]
AcrRefreshToken = "ACRRefreshToken"
AcrAccessToken = "ACRAccessToken"

# Rename binary request param and response property (the replaces of
# Body in blob_client.go and client.go)
[body_fields]
ContainerRegistryBlob_GetBlob = "BlobData"
ContainerRegistryBlob_GetChunk = "ChunkData"
ContainerRegistry_GetManifest = "ManifestData"
