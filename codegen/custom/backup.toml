# azadmin/backup: what Go's module changes after generating
# (backup/testdata/generate/transforms.go of azadmin v1.5.0) and its
# shape.
data_plane = true
# TypeSpec's Go emitter writes only the types operations reach.
reachable_only = true
# custom_client.xo uses the challenge policy.
requires = ["github.com/xo-lang/azure/security/keyvault/internal"]
# The restores use Go's custom restorePoller (custom_client.go).
status_pollers = ["FullRestoreOperation", "SelectiveKeyRestoreOperation", "PreFullRestoreOperation"]

# `Error *string` becomes `*ErrorInfo` (custom_client.xo).
[field_types]
error = "ErrorInfo"
