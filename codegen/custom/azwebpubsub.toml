# azwebpubsub: Go's autorest.md (azwebpubsub v0.1.1) as structured edits,
# in its order.
data_plane = true
# remove-non-reference-schema: true
remove_unreferenced = true
# Rename enum WebPubSubPermission to Permission since the package name
# already contains WebPubSub.
models = { WebPubSubPermission = "Permission" }
# Make GenerateClientToken internal; make *Exists internal until SDK
# supports it; make CheckPermission internal until SDK supports it, since
# it leverage 404 status code
private_ops = ["Client.GenerateClientToken", "Client.GroupExists", "Client.ConnectionExists", "Client.UserExists", "Client.CheckPermission"]
# delete unused error models
drop_models = ["ErrorDetail", "InnerError"]

# Remove HealthAPI
[[patch]]
pointer = "/paths/~1api~1health/head"
op = "delete"

# delete client name prefix from method options and response types
[[replace]]
pattern = 'Client(\w+)((?:Options|Response))'
with = "$1$2"

# (the same transform, on the response's field: Go's embedded
# TokenResponse)
[[replace]]
pattern = '\bclient_token_response\b'
with = "token_response"
