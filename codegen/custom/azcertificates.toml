# azcertificates: what Go's module changes after generating
# (testdata/generate/transforms.go of azcertificates v1.5.0) and its shape.
data_plane = true
reachable_only = true
# Go's List*Properties* take no maxresults.
drop_params = ["maxresults"]
allow_empty = ["certificate-version"]
requires = ["github.com/xo-lang/azure/security/keyvault/internal"]

# `KID`, `SID` and the certificates' `ID` become `*ID` (custom_client.xo).
[field_types]
kid = "ID"
sid = "ID"
"certificate.id" = "ID"
"certificateoperation.id" = "ID"
"certificatepolicy.id" = "ID"
"certificateproperties.id" = "ID"
"deletedcertificate.id" = "ID"
"deletedcertificateproperties.id" = "ID"
# client.tsp's `@@alternateType(CertificateOperation.error, string, "go")`
# is undone by Go's transforms.go: the field stays an ErrorInfo
"certificateoperation.error" = "ErrorInfo"

# Go drops the DeletionRecoveryLevel constants for a plain string, and
# reads an operation's error as ErrorInfo (custom_client.xo).
[replace_types]
DeletionRecoveryLevel = "Str"
ErrorModel = "ErrorInfo"
