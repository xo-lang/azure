# azopenai: Go's autorest.md (azopenai v0.9.0) as structured edits. Go
# compiles OpenAI.Inference's TypeSpec at its tsp-location commit to
# openapi.json; the spec repo's generated.json at that commit is the same
# emitter's output for the latest version, 2025-01-01-preview. Go keeps
# only the Azure "On Your Data", enhancement and content filter models:
# the module has no client (requests go through openai-go).
data_plane = true
# Keep only "Azure OpenAI On Your Data" models, or enhancements:
# ^(OnYour|Azure|Pinecone|ContentFilter|Mongo|Elasticsearch).+$
keep_definitions = ["OnYour", "Azure", "Pinecone", "ContentFilter", "Mongo", "Elasticsearch"]

# clear out any operations, we aren't going to use them.
[[patch]]
pointer = "/paths"
op = "set"
value = '{}'

[[patch]]
pointer = "/x-ms-paths"
op = "delete"

[[patch]]
pointer = "/parameters"
op = "set"
value = '{}'

# Azure.Core.Foundations.Error is Error, without innererror, details and
# target; InnerError and ErrorResponse are not emitted.
[[patch]]
pointer = "/definitions/Azure.Core.Foundations.Error/x-ms-client-name"
op = "set"
value = '"Error"'

[[patch]]
pointer = "/definitions/Azure.Core.Foundations.Error/properties/innererror"
op = "delete"

[[patch]]
pointer = "/definitions/Azure.Core.Foundations.Error/properties/details"
op = "delete"

[[patch]]
pointer = "/definitions/Azure.Core.Foundations.Error/properties/target"
op = "delete"

[[patch]]
pointer = "/definitions/Azure.Core.Foundations.InnerError/x-ms-external"
op = "set"
value = 'true'

[[patch]]
pointer = "/definitions/Azure.Core.Foundations.ErrorResponse/x-ms-external"
op = "set"
value = 'true'

# MongoDBChatExtensionParameters.embedding_dependency is its custom type
# (custom_models.xo).
[[patch]]
pointer = "/definitions/MongoDBChatExtensionParametersEmbeddingDependency"
op = "set"
value = '{"x-ms-external": true, "type": "object", "properties": {"stub": {"type": "string"}}}'

[[patch]]
pointer = "/definitions/MongoDBChatExtensionParameters/properties/embedding_dependency/$ref"
op = "set"
value = '"#/definitions/MongoDBChatExtensionParametersEmbeddingDependency"'

[field_types]
"mongodbchatextensionparameters.embedding_dependency" = "MongoDBChatExtensionParametersEmbeddingDependency"
