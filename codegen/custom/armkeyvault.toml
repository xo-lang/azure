# What armkeyvault v2.1.0 (Go's TypeSpec emitter) orders differently from
# the path: a deleted vault's or HSM's name comes before its location.
[param_order]
vaults_getdeleted = ["vaultName", "location"]
vaults_purgedeleted = ["vaultName", "location"]
managedhsms_getdeleted = ["name", "location"]
managedhsms_purgedeleted = ["name", "location"]
