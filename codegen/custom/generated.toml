# azappconfig's internal/generated: Go's TypeSpec emitter output, which
# the hand-written data/azappconfig Client wraps (as Go's
# internal/generated).
data_plane = true
# TypeSpec's Go emitter writes only the types operations reach.
reachable_only = true
# Go v2.3.0's emitter writes the query's spaces as %20 (the client's
# query normalization policy then writes the query again, as Go's).
query_pct20 = true
