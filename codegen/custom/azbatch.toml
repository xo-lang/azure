# azbatch: Go's TypeSpec emitter output (tspconfig: single-client, one
# BatchClient @client block for every language).
data_plane = true
# Go sends Accept on every operation.
accept_always = true
# The OpenAPI file's ...Update and ...Patch variants are Go's base types.
merge_update_variants = true
# PATCH bodies are plain JSON in Go, not merge patches.
patch_twins = false
# client.tsp: @@access(Azure.Batch.Pools.listPoolUsageMetrics,
# Access.internal, "go"), retired before Go's first release.
private_ops = ["Client.ListPoolUsageMetrics"]

# Its types are Go's unexported ones.
[models]
BatchPoolListUsageMetricsResult = "listPoolUsageMetricsResult"
BatchPoolUsageMetrics = "poolUsageMetrics"

# Go's emitter casing: OCPDate, MaxResults, SelectParam (select is a Go
# keyword).
[param_names]
"ocp-date" = "OCPDate"
maxresults = "maxResults"
"$select" = "selectParam"

# Go's OCPBatchFileIsDirectory.
[header_names]
"ocp-batch-file-isdirectory" = "ocp_batch_file_is_directory"
