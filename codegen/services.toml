# One row per generated module (decision 0002): its directory, the spec
# folder, and the readme tag azure-sdk-for-go generates it from, with the
# Go module and version it matches, and the Xo module's own version. A
# TypeSpec module names its emitted OpenAPI file instead of a readme tag,
# and the commit Go's tsp-location.yaml pins. codegen/cmd/sync-go fills it later;
# rows are written by hand until then.

