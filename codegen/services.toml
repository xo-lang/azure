# One row per generated module (decision 0002): its directory, the spec
# folder, and the readme tag azure-sdk-for-go generates it from, with the
# Go module and version it matches, and the Xo module's own version. A
# TypeSpec module names its emitted OpenAPI file instead of a readme tag,
# and the commit Go's tsp-location.yaml pins. codegen/cmd/sync-go fills it later;
# rows are written by hand until then.

[[service]]
dir = "resourcemanager/resources/armresources"
spec = "specification/resources/resource-manager"
readme_tag = "package-resources"
go_module = "github.com/Azure/azure-sdk-for-go/sdk/resourcemanager/resources/armresources"
go_version = "v1.2.0"
version = "v0.1.0"

[[service]]
dir = "security/keyvault/azsecrets"
spec = "specification/keyvault/Security.KeyVault.Secrets"
openapi = "specification/keyvault/data-plane/Microsoft.KeyVault/stable/7.6/secrets.json"
commit = "e4ee008e38fd34b530df834ef8b966835a641b13"
go_module = "github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azsecrets"
go_version = "v1.4.0"
version = "v0.1.0"
