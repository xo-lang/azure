# This repository's additions to the shared gitleaks configuration
# (decision 0007). scripts/check-public.sh writes a configuration that
# extends the shared one ([extend] path) and appends this file, so the
# shared rules stay unchanged and strict. Each entry is one exact path
# with why.

[allowlist]
description = "test-only data (decision 0007)"
paths = [
  # an invented self-signed certificate and key for the client
  # certificate tests, valid nowhere (azidentity/testdata/README.md);
  # native Xo cannot generate RSA keys yet
  '''^azidentity/testdata/test-certificate\.pem$''',
]
# regexes are tested against the matched text only
regexTarget = "match"
regexes = [
  # Shared Key signatures made with Azurite's public development
  # account and key (devstoreaccount1, documented by Microsoft for the
  # emulator), the signing vectors in storage/azblob/testdata; HMACs,
  # not secrets. Only that account's signatures match.
  '''^SharedKey devstoreaccount1:[A-Za-z0-9+/]{43}="?$''',
]
