# This repository's additions to the shared gitleaks configuration
# (decision 0007). scripts/check-public.sh writes a configuration that
# extends the shared one ([extend] path) and appends this file, so the
# shared rules stay unchanged and strict. Each entry is one exact path
# with why.

[allowlist]
description = "test-only data (decision 0007)"
paths = [
  # an invented self-signed certificate and key for the client
  # certificate tests, valid nowhere (azidentity/testdata/README.md);
  # native Xo cannot generate RSA keys yet
  '''^azidentity/testdata/test-certificate\.pem$''',
  # invented PKCS #12 test files made from that certificate (and keys
  # invented and thrown away) by azidentity/testdata/make-pfx.sh, with
  # the test password xo-test-only (azidentity/testdata/README.md);
  # gitleaks's pkcs12-file rule flags any .pfx. Only test-*.pfx in that
  # directory.
  '''^azidentity/testdata/test-[a-z]+\.pfx$''',
  # the generator's rows: public azure-rest-api-specs commit SHAs
  # (40 hex digits, which a shared rule for 40-hex access tokens reads as a
  # token), spec paths and Go module paths, derived from Go's modules by
  # codegen/gorows; check-public.sh's own checks still scan it
  '''^codegen/services\.toml$''',
]
commits = [
  # b5bcc67 (storage/azfile's first slice) put 27 Shared Key signatures
  # in storage/azfile/fvectors_test.xo: HMACs over the invented key
  # "invented-key" for the invented account acct1, not secrets, but
  # pushed before the vectors hid them as the other storage modules do
  # (short sha256s, since the next commit). Pushed history is not
  # rewritten; only that commit is allowed, and it adds nothing else
  # but azfile's code and tests.
  "b5bcc67efa18c07424a2b41922a21693e4a20da1",
]
# regexes are tested against the matched text only
regexTarget = "match"
regexes = [
  # Shared Key signatures made with Azurite's public development
  # account and key (devstoreaccount1, documented by Microsoft for the
  # emulator), the signing vectors in storage/azblob/testdata; HMACs,
  # not secrets. Only that account's signatures match.
  '''^SharedKey devstoreaccount1:[A-Za-z0-9+/]{43}="?$''',
]
